        totalApplications:
          type: integer
          minimum: 0
        websiteApplications:
          type: integer
          minimum: 0
        offlineApplications:
          type: integer
          minimum: 0
        completeApplications:
          type: integer
          minimum: 0
        byStatus:
          type: object
          additionalProperties: false
          required:
            - Verifikasi
            - Terverifikasi
            - Wawancara
            - Diterima
            - Ditolak
          properties:
            Verifikasi:
              type: integer
              minimum: 0
            Terverifikasi:
              type: integer
              minimum: 0
            Wawancara:
              type: integer
              minimum: 0
            Diterima:
              type: integer
              minimum: 0
            Ditolak:
              type: integer
              minimum: 0
        publishedPosts:
          type: integer
          minimum: 0
        unreadMessages:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
        newsletterCount:
          type: integer
          minimum: 0
        weekly:
          type: array
          items:
            type: object
            required:
              - week
              - count
            properties:
              week:
                type: string
                format: date
              count:
                type: integer
                minimum: 0
    ExtracurricularSelections:
      type: array
      uniqueItems: true
      default: []
      items:
        type: string
        minLength: 1
        maxLength: 80
      description: >-
        Opsional, boleh kosong/lebih dari satu. Nama kegiatan aktif; Belum menentukan tidak dikirim
        sebagai kegiatan. Normalisasi nama dan validasi aktif dilakukan server, pilihan historis
        disimpan sebagai snapshot.
    DocumentRequirements:
      type: object
      additionalProperties: false
      properties:
        requiredKinds:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - skl
              - ijazah
              - kk
              - ktp
              - akta
              - rapor
              - pasfoto
          default: []
        requireOneGraduationDocument:
          type: boolean
          default: false
      required:
        - requiredKinds
        - requireOneGraduationDocument
      description: >-
        Dapat diatur admin. requiredKinds mewajibkan semua jenis yang dipilih;
        requireOneGraduationDocument meminta minimal satu SKL/ijazah. PIP/KIP selalu opsional; photo
        lama tidak bisa diwajibkan. Konfigurasi baru hanya berlaku pada pendaftaran baru.
    ApplicantRecord:
      type: object
      additionalProperties: false
      required:
        - studentName
        - nisn
        - originSchool
        - birthPlace
        - birthDate
        - gender
        - address
        - parentName
        - phone
        - email
        - id
        - source
        - status
        - submittedAt
        - documents
        - extracurriculars
        - documentRequirements
      properties:
        studentName:
          type: string
          minLength: 2
          maxLength: 120
        nisn:
          type: string
          pattern: ^[0-9]{10}$
        originSchool:
          type: string
          minLength: 2
          maxLength: 160
        birthPlace:
          type: string
          minLength: 2
          maxLength: 100
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum:
            - Laki-laki
            - Perempuan
        address:
          type: string
          minLength: 1
          maxLength: 600
        parentName:
          type: string
          minLength: 2
          maxLength: 120
        parentOccupation:
          type: string
          maxLength: 120
        phone:
          type: string
          pattern: ^[+]?[0-9 ]{8,20}$
        email:
          type: string
          format: email
          maxLength: 254
        id:
          type: string
          pattern: ^NH-[A-Z0-9-]+$
        source:
          $ref: '#/components/schemas/RegistrationSource'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        submittedAt:
          type: string
          format: date-time
        documents:
          $ref: '#/components/schemas/ApplicantDocumentList'
        extracurriculars:
          $ref: '#/components/schemas/ExtracurricularSelections'
        documentRequirements:
          $ref: '#/components/schemas/DocumentRequirements'
          readOnly: true
          description: >-
            Snapshot kebijakan saat pendaftaran. Filter kelengkapan dan pemeriksaan memakai snapshot
            ini, bukan pengaturan terbaru.
      description: >-
        ID API adalah nomor pendaftaran NH-..., UUID database tidak dipakai sebagai nomor yang
        ditampilkan. Satu record applications untuk online/offline. Jenis dokumen unik per
        pendaftar; riwayat penggantian tersimpan internal.
    ApplicantDocumentReplacement:
      type: object
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          minLength: 1
          x-max-bytes: 5242880
      required:
        - file
    ApplicantDocument:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - label
        - status
        - hasFile
        - receivedPhysically
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/DocumentKind'
        label:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/DocumentStatus'
        hasFile:
          type: boolean
        receivedPhysically:
          type: boolean
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        size:
          type: integer
          minimum: 1
          maximum: 5242880
        uploadedAt:
          type: string
          format: date-time
        reviewNote:
          type: string
          maxLength: 400
        reviewedAt:
          type:
            - string
            - 'null'
          format: date-time
      allOf:
        - if:
            properties:
              hasFile:
                const: true
          then:
            required:
              - fileName
              - mimeType
              - size
              - uploadedAt
            properties:
              fileName:
                type: string
                minLength: 1
                maxLength: 255
              mimeType:
                type: string
                enum:
                  - application/pdf
                  - image/jpeg
                  - image/png
              size:
                type: integer
                minimum: 1
                maximum: 5242880
              uploadedAt:
                type: string
                format: date-time
          else:
            not:
              anyOf:
                - required:
                    - fileName
                  properties:
                    fileName:
                      type: string
                      minLength: 1
                      maxLength: 255
                - required:
                    - mimeType
                  properties:
                    mimeType:
                      type: string
                      enum:
                        - application/pdf
                        - image/jpeg
                        - image/png
                - required:
                    - size
                  properties:
                    size:
                      type: integer
                      minimum: 1
                      maximum: 5242880
                - required:
                    - uploadedAt
                  properties:
                    uploadedAt:
                      type: string
                      format: date-time
        - if:
            properties:
              status:
                enum:
                  - Menunggu pemeriksaan
                  - Terverifikasi
                  - Perlu perbaikan
          then:
            anyOf:
              - properties:
                  hasFile:
                    const: true
              - properties:
                  receivedPhysically:
                    const: true
        - if:
            properties:
              status:
                const: Belum ada
          then:
            properties:
              hasFile:
                const: false
              receivedPhysically:
                const: false
        - if:
            properties:
              status:
                const: Perlu perbaikan
          then:
            required:
              - reviewNote
            properties:
              reviewNote:
                type: string
                minLength: 1
                maxLength: 400
                pattern: \S
      description: Metadata berkas milik pendaftar sendiri; tanpa identitas pemeriksa atau lokasi storage.
    ApplicantDocumentList:
      type: array
      maxItems: 7
      items:
        $ref: '#/components/schemas/ApplicantDocument'
