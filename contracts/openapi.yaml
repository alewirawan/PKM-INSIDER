        '413':
          description: File terlalu besar
        '415':
          description: Jenis file tidak didukung
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: nh_admin_session
    applicantSession:
      type: apiKey
      in: cookie
      name: nh_applicant_session
      description: >-
        Cookie HttpOnly terpisah, 12 jam, terikat satu pendaftaran. Login memakai nomor dan
        password; pemulihan melalui tautan admin sekali pakai.
  parameters:
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: string
        pattern: ^NH-[A-Z0-9-]+$
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: >-
        UUID per percobaan submit logis. Pakai ulang saat retry dengan isi sama. Server menyimpan
        hasil sukses 24 jam; isi berbeda memakai key sama menghasilkan 409. Key bukan izin akses dan
        tidak dimasukkan URL/log.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Session tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Data tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Terlalu banyak permintaan
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Izin ditolak, atau PPDB publik sedang ditutup
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflik data, versi, status, atau idempotency key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Penyimpanan sementara gagal; belum boleh menampilkan pendaftaran berhasil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    AdminSession:
      type: object
      required:
        - user
        - expiresAt
      properties:
        user:
          type: object
          required:
            - id
            - name
            - role
          properties:
            id:
              type: string
            name:
              type: string
            role:
              type: string
              enum:
                - super_admin
                - admin_ppdb
                - editor
        expiresAt:
          type: string
          format: date-time
    RegistrationSource:
      type: string
      enum:
        - Website
        - Offline
    ApplicationStatus:
      type: string
      enum:
        - Verifikasi
        - Terverifikasi
        - Wawancara
        - Diterima
        - Ditolak
    DocumentKind:
      type: string
      enum:
        - skl
        - ijazah
        - kk
        - ktp
        - kip
        - akta
        - rapor
        - pasfoto
        - photo
      description: photo hanya untuk membaca metadata lama. Upload baru memakai UploadDocumentKind.
    StudentDocument:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - label
        - status
        - hasFile
        - receivedPhysically
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/DocumentKind'
        label:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/DocumentStatus'
        hasFile:
          type: boolean
        receivedPhysically:
          type: boolean
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        size:
          type: integer
          minimum: 1
          maximum: 5242880
        uploadedAt:
          type: string
          format: date-time
        reviewNote:
          type: string
          maxLength: 400
        reviewedAt:
          type:
            - string
            - 'null'
          format: date-time
        reviewedBy:
          type:
            - string
            - 'null'
          maxLength: 120
      allOf:
        - if:
            properties:
              hasFile:
                const: true
          then:
            required:
              - fileName
              - mimeType
              - size
              - uploadedAt
            properties:
              fileName:
                type: string
                minLength: 1
                maxLength: 255
              mimeType:
                type: string
                enum:
                  - application/pdf
                  - image/jpeg
                  - image/png
              size:
                type: integer
                minimum: 1
                maximum: 5242880
              uploadedAt:
                type: string
                format: date-time
          else:
            not:
              anyOf:
                - required:
                    - fileName
                  properties:
                    fileName:
                      type: string
                      minLength: 1
                      maxLength: 255
                - required:
                    - mimeType
                  properties:
                    mimeType:
                      type: string
                      enum:
                        - application/pdf
                        - image/jpeg
                        - image/png
                - required:
                    - size
                  properties:
                    size:
                      type: integer
                      minimum: 1
                      maximum: 5242880
                - required:
                    - uploadedAt
                  properties:
                    uploadedAt:
                      type: string
                      format: date-time
        - if:
            properties:
              status:
                enum:
                  - Menunggu pemeriksaan
                  - Terverifikasi
                  - Perlu perbaikan
          then:
            anyOf:
              - properties:
                  hasFile:
                    const: true
              - properties:
                  receivedPhysically:
                    const: true
        - if:
            properties:
              status:
                const: Belum ada
          then:
            properties:
              hasFile:
                const: false
              receivedPhysically:
                const: false
        - if:
            properties:
