name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build --workspace=@nurul-huda/backend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: nurul_huda_ci
      COMPOSE_PROJECT_NAME: nurul-huda-ci
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary test database password
        run: |
          db_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
      - name: Validate and start full stack
        run: |
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f compose.dev.yaml up --build -d --wait --wait-timeout 300
      - name: Test database, authentication and frontend API integration
        run: docker compose -f compose.dev.yaml run --rm -e RUN_DOCKER_SMOKE=1 backend node docker/smoke.mjs
      - name: Run team checks inside Docker
        run: docker compose -f compose.dev.yaml run --rm checks
      - name: Test complete admission and administration workflows
        run: docker compose -f compose.dev.yaml run --rm -e RUN_FULL_SYSTEM_TESTS=1 backend npm test --workspace=@nurul-huda/backend -- --run tests/full-system.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser test runner
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare isolated browser fixtures
        run: docker compose -f compose.dev.yaml run --rm -e RUN_BROWSER_TESTS=1 backend node docker/prepare-browser-test.mjs
      - name: Test browser admission workflow and responsive pages
        env:
          RUN_BROWSER_TESTS: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 3
      - name: Verify persistence after container recreation
        run: |
          docker compose -f compose.dev.yaml down
          docker compose -f compose.dev.yaml up -d --wait --wait-timeout 300
          docker compose -f compose.dev.yaml run --rm -e RUN_DOCKER_SMOKE=1 backend node docker/smoke.mjs --verify
      - name: Diagnostics
        if: failure()
        run: docker compose -f compose.dev.yaml logs --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.dev.yaml down
